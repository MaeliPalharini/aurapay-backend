spring:
  application:
    name: aurapay-backend

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/aurapay}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    url: ${DB_URL:jdbc:postgresql://localhost:5432/aurapay}
    user: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}

server:
  port: ${SERVER_PORT:8080}

mercado-pago:
  mock: ${MERCADO_PAGO_MOCK:true}
  base-url: ${MERCADO_PAGO_BASE_URL:https://api.mercadopago.com}
