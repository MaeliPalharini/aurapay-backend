spring:
  application:
    name: aurapay-backend

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/aurapay}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    url: ${DB_URL:jdbc:postgresql://localhost:5432/aurapay}
    user: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}

server:
  port: ${SERVER_PORT:8080}

mercado-pago:
  mock: ${MERCADO_PAGO_MOCK:false}
  base-url: ${MERCADO_PAGO_BASE_URL:https://api.mercadopago.com}
  access-token: ${MERCADO_PAGO_ACCESS_TOKEN:TEST-2493260850463805-051018-4da519795595307dbc651187b8758881-155409700}
  default-payer-email: ${MERCADO_PAGO_DEFAULT_PAYER_EMAIL:cliente.aurapay@gmail.com}
  notification-url: ${MERCADO_PAGO_NOTIFICATION_URL:}

security:
  jwt:
    secret: ${JWT_SECRET:aurapay-dev-secret-troque-em-producao-0123456789}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:120}